[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncrnanet"
version = "0.1.0"
description = "AI-guided ncRNA interaction prediction and disease-aware ceRNA target discovery for spinal cord injury"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["ncRNA", "ceRNA", "graph attention", "spinal cord injury", "target discovery"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "networkx>=3.0",
    "confuse>=2.0",
    "clize>=5.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "black>=24.0", "isort>=5.12", "mypy>=1.8"]

[project.scripts]
ncrnanet = "ncrnanet.bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ncrnanet = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/ncrnanet"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
